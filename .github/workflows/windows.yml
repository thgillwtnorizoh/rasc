name: RASC Windows build and development tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and run core tests
        run: dotnet test tests/Rasc.Core.Tests/Rasc.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=rasc.trx"
      - name: Compile native WPF app
        run: dotnet build src/Rasc.Desktop/Rasc.Desktop.csproj --configuration Release --no-incremental
      - name: WPF real-window profile transition smoke
        timeout-minutes: 4
        shell: pwsh
        run: |
          $env:RASC_SMOKE_FRAME_DIR = Join-Path $env:GITHUB_WORKSPACE "artifacts/Rasc-Wpf-Smoke"
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- modern-rare
          if ($LASTEXITCODE -ne 0) { throw "Modern rare PNG-mask glow visibility/animation smoke failed" }
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- classic-only
          if ($LASTEXITCODE -ne 0) { throw "Classic-only WPF smoke failed" }
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- modern-idle-classic
          if ($LASTEXITCODE -ne 0) { throw "Idle Modern-to-Classic WPF smoke failed" }
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- modern-stack-two
          if ($LASTEXITCODE -ne 0) { throw "Modern two-card seamless-stack WPF smoke failed" }
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- modern-classic
          if ($LASTEXITCODE -ne 0) { throw "Modern-to-Classic WPF smoke failed" }
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- modern-progress
          if ($LASTEXITCODE -ne 0) { throw "Modern progress-icon WPF smoke failed" }
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- font-sound-settings
          if ($LASTEXITCODE -ne 0) { throw "Font and sound setting WPF smoke failed" }
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- modern-typography
          if ($LASTEXITCODE -ne 0) { throw "Modern CSS source typography WPF smoke failed" }
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- modern-queued-sound
          if ($LASTEXITCODE -ne 0) { throw "Queued Modern wave sound re-admission WPF smoke failed" }
          dotnet run --project tests/Rasc.Desktop.Smoke/Rasc.Desktop.Smoke.csproj --configuration Release -- installation-recovery
          if ($LASTEXITCODE -ne 0) { throw "Steam/GC missing-file recovery WPF smoke failed" }
      - name: Capture exact CodePen fixture in installed Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Rasc-Wpf-Smoke'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $chromeCandidates = @(
            (Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Google/Chrome/Application/chrome.exe')
          )
          $chrome = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome unavailable: cannot establish browser reference pixels.' }
          Copy-Item 'src/Rasc.Desktop/Assets/SteamRareMasks/*.png' -Destination $out
          $fixture = Get-Content 'tests/reference/legendary-codepen.html' -Raw
          foreach ($ms in @(900, 2000)) {
            $time = $ms / 1000
            $freeze = ".AchievementIconGlowContainer, .AchievementIconGlow { animation-delay: -${time}s !important; animation-play-state: paused !important; }"
            $html = $fixture.Replace('</style>', "$freeze`n</style>")
            $referencePath = Join-Path $env:GITHUB_WORKSPACE "tests/reference/legendary-frozen-$ms.html"
            [System.IO.File]::WriteAllText($referencePath, $html)
            $referenceUrl = ([System.Uri]::new($referencePath)).AbsoluteUri
            $imagePath = Join-Path $out "chromium-legendary-$ms.png"
            $profile = Join-Path $env:RUNNER_TEMP "rasc-chrome-$ms"
            $arguments = @('--headless=new', '--no-first-run', '--no-default-browser-check',
              '--disable-extensions', "--user-data-dir=$profile", '--hide-scrollbars',
              '--force-device-scale-factor=1', '--window-size=440,240',
              '--virtual-time-budget=500',
              "--screenshot=$imagePath", $referenceUrl)
            $process = Start-Process -FilePath $chrome -ArgumentList $arguments -Wait -PassThru
            Write-Output "Chrome phase=$ms exit=$($process.ExitCode) outputExists=$(Test-Path $imagePath) uri=$referenceUrl"
            if ($process.ExitCode -ne 0 -or -not (Test-Path $imagePath)) {
              throw "Chrome reference screenshot failed at $ms ms"
            }
          }
          # Controls establish whether the local PNG masks actually load.
          # A screenshot of CSS shadows alone is NOT a valid animation reference.
          $controls = @(
            @{ Name='no-glow'; Css='.AchievementIconGlowContainerRoot {display:none !important;}' },
            @{ Name='no-masks'; Css='.AchievementIconGlowContainerRoot, .AchievementIconGlowContainer {-webkit-mask-image:none !important;mask-image:none !important;}' }
          )
          foreach ($control in $controls) {
            $html = $fixture.Replace('</style>', "$($control.Css)`n</style>")
            $referencePath = Join-Path $env:GITHUB_WORKSPACE "tests/reference/legendary-$($control.Name).html"
            [System.IO.File]::WriteAllText($referencePath, $html)
            $referenceUrl = ([System.Uri]::new($referencePath)).AbsoluteUri
            $imagePath = Join-Path $out "chromium-legendary-$($control.Name).png"
            $profile = Join-Path $env:RUNNER_TEMP "rasc-chrome-$($control.Name)"
            $arguments = @('--headless=new', '--no-first-run', '--no-default-browser-check',
              '--disable-extensions', "--user-data-dir=$profile", '--hide-scrollbars',
              '--force-device-scale-factor=1', '--window-size=440,240',
              '--virtual-time-budget=500', "--screenshot=$imagePath", $referenceUrl)
            $process = Start-Process -FilePath $chrome -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0 -or -not (Test-Path $imagePath)) {
              throw "Chrome source-control screenshot failed: $($control.Name)"
            }
          }
          $first = (Get-FileHash (Join-Path $out 'chromium-legendary-900.png')).Hash
          $second = (Get-FileHash (Join-Path $out 'chromium-legendary-2000.png')).Hash
          $hidden = (Get-FileHash (Join-Path $out 'chromium-legendary-no-glow.png')).Hash
          Write-Output "BROWSER VALIDITY: phase-frames-differ=$($first -ne $second); glow-differs-from-shadow-only=$($first -ne $hidden)"
          if ($first -eq $second -or $first -eq $hidden) {
            Write-Warning "Chrome raster does not discriminate the masked animation: do not claim phase-matched visual fidelity."
          }
      - name: Upload WPF rare-glow frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rasc-C07-Gold-and-Chromium-Parity-Frames
          path: artifacts/Rasc-Wpf-Smoke/
          if-no-files-found: warn
      - name: Publish self-contained Windows x64
        run: dotnet publish src/Rasc.Desktop/Rasc.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/Rasc-Windows-x64 -p:PublishSingleFile=false
      - name: Verify published editable achievement definitions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'artifacts/Rasc-Windows-x64/Data/achievement-definitions.v0.2.csv'
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
            throw "Editable achievement catalog missing from the published Windows package: $file"
          }
          $records = @(Get-Content -LiteralPath $file | Where-Object {
            $_.Trim() -and -not $_.TrimStart().StartsWith('#')
          })
          if ($records.Count -ne 168) {
            throw "Expected one header and 167 achievement definition records; found $($records.Count)"
          }
          Write-Output "Published editable P006 v0.2 catalog verified: 167 rows."

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Rasc-Windows-x64
          path: artifacts/Rasc-Windows-x64/
          if-no-files-found: error
